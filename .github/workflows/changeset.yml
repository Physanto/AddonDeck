name: Changeset

# Separate from CI so that adding or removing the label re-runs only this check.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changeset:
    name: Changeset present and short
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Check changesets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SKIP_CHANGESET: ${{ contains(github.event.pull_request.labels.*.name, 'no-changeset') }}
        run: node tooling/changesets/check-changesets.ts "$BASE_SHA"
